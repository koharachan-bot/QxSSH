{{template "header" .}}
<section class="narrow">
  <h2>登录</h2>
  <form method="post" action="/login" class="form">
    <label>邮箱<input type="email" name="email" required autocomplete="username"></label>
    <label>口令<input type="password" name="password" required autocomplete="current-password"></label>
    <div class="ts-slot">{{template "turnstile" .}}</div>
    <button class="btn" type="submit">登录</button>
  </form>
  <p class="muted">还没有账号？<a href="/register">立即注册</a></p>
</section>
<script src="/static/challenge.js"></script>
{{template "footer" .}}
