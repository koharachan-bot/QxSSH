{{template "header" .}}
<section class="narrow">
  <h2>登录</h2>
  <form method="post" action="/login" class="form" data-challenge-form>
    <label>邮箱<input type="email" name="email" required autocomplete="username" disabled></label>
    <label>口令<input type="password" name="password" required autocomplete="current-password" disabled></label>
    <div class="challenge-row">
      <span class="challenge-status" data-challenge-status data-kind="busy">正在验证浏览器…</span>
      <button class="link" type="button" data-challenge-retry hidden>重试</button>
    </div>
    <button class="btn" type="submit" disabled>登录</button>
  </form>
  <p class="muted">还没有账号？<a href="/register">立即注册</a></p>
</section>
<script src="/static/challenge.js"></script>
{{template "footer" .}}
