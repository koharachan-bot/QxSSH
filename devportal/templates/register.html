{{template "header" .}}
<section class="narrow">
  <h2>注册开发者账号</h2>
  <form method="post" action="/register" class="form">
    <label>邮箱<input type="email" name="email" required autocomplete="username"></label>
    <label>昵称<input type="text" name="nickname" maxlength="40" placeholder="可选"></label>
    <label>口令<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn" type="submit">创建账号</button>
  </form>
</section>
{{template "footer" .}}
