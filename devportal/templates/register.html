{{template "header" .}}
<section class="narrow">
  <h2>注册开发者账号</h2>
  <form method="post" action="/register" class="form" data-challenge-form>
    <label>邮箱<input type="email" name="email" required autocomplete="username" disabled></label>
    <label>昵称<input type="text" name="nickname" maxlength="40" placeholder="可选" disabled></label>
    <label>口令<input type="password" name="password" required minlength="8" autocomplete="new-password" disabled></label>
    <div class="challenge-row">
      <span class="challenge-status" data-challenge-status data-kind="busy">正在验证浏览器…</span>
      <button class="link" type="button" data-challenge-retry hidden>重试</button>
    </div>
    <button class="btn" type="submit" disabled>创建账号</button>
  </form>
</section>
<script src="/static/challenge.js"></script>
{{template "footer" .}}
