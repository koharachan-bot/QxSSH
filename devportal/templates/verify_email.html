{{template "header" .}}
<section class="narrow">
  <h2>验证邮箱</h2>
  <p class="muted">验证码已发送到 <strong class="mono">{{.Data}}</strong>，请查收邮件（含垃圾箱）。</p>
  <form method="post" action="/verify-email" class="form">
    <label>6 位验证码<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456" required autofocus></label>
    <button class="btn" type="submit">完成验证</button>
  </form>
  <form method="post" action="/verify-email/resend" class="mt12">
    <button class="link" type="submit">没收到？重新发送验证码</button>
  </form>
  <p class="muted small mt12">验证码 15 分钟内有效，连续输错 5 次需要重新获取。</p>
</section>
{{template "footer" .}}
