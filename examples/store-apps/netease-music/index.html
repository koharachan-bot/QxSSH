<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>网易云音乐</title>
<script>(function(){var t='';try{t=new URLSearchParams(location.search).get('theme')||''}catch(e){}if(t!=='dark'&&t!=='light'){t='';try{var c=localStorage.getItem('qx-prefs-cache');t=(c?(JSON.parse(c)['qx-theme']||''):'')||localStorage.getItem('qx-theme')||''}catch(e){}}var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d)})()</script>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app" class="nm-root">
  <div class="nm-bar">
    <span class="nm-dot"></span>
    <span class="nm-title">网易云音乐</span>
    <span class="nm-grow"></span>
    <button class="nm-btn" id="reload" type="button" title="重新加载">重新加载</button>
    <a class="nm-btn" id="external" target="_blank" rel="noreferrer noopener" title="在浏览器中打开">外部打开</a>
  </div>
  <div class="nm-stage">
    <iframe id="player"
            src="https://music.163.com/st/webplayer"
            allow="autoplay; encrypted-media; fullscreen; clipboard-write; picture-in-picture"
            referrerpolicy="no-referrer"
            allowfullscreen></iframe>
    <div class="nm-fallback" id="fallback" hidden>
      <p>页面加载较慢或空白，可能是网络问题或站点限制了嵌入。</p>
      <p>可以点右上角「外部打开」在新标签页中使用。</p>
    </div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
